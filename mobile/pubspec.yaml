name: wildsnap
description: WildSnap - Gamified wildlife photography app. Catch the Wild. Save the Planet.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP
  dio: ^5.4.3

  # Local storage
  sqflite: ^2.3.2
  shared_preferences: ^2.2.3

  # Camera
  camera: ^0.10.5+9
  image_picker: ^1.1.2

  # Location
  geolocator: ^11.0.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Auth
  google_sign_in: ^6.2.1
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1

  # Connectivity
  connectivity_plus: ^6.0.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  image: ^4.2.0
  path_provider: ^2.1.3
  path: ^1.9.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
